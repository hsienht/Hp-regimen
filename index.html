<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幽門桿菌治療服藥指南</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

<!-- ══ INPUT PANEL ══ -->
<div class="input-panel">

<!-- ── Preset Manager Panel ── -->
<div class="mgr-panel" id="mgrPanel">
  <div class="mgr-title">
    組套管理
    <span class="mgr-mode-hint" id="mgrModeHint"></span>
  </div>
  <div class="mgr-list" id="mgrList"></div>
  <div class="mgr-actions">
    <button class="btn btn-sm primary" id="mgrSaveBtn" style="display:none" onclick="mgrSave()">儲存修改</button>
    <button class="btn btn-sm warn" id="mgrRevertBtn" style="display:none" onclick="mgrRevert()">回復</button>
    <button class="btn btn-sm" onclick="closeMgr()">關閉</button>
  </div>
  <div class="mgr-hint" id="mgrHint"></div>
</div>

<!-- ── Drug Manager Panel ── -->
<div class="drug-panel" id="drugPanel">
  <div class="drug-panel-title-row">藥品管理</div>
  <div class="drug-panel-scroll">
    <div id="dmList"></div>
    <button class="add-drug-btn" style="margin-top:8px" onclick="dmAddDrug()">＋ 新增藥品</button>
  </div>
  <div class="drug-panel-actions">
    <button class="btn btn-sm primary" id="dmSaveBtn" style="display:none" onclick="saveDrugMgr()">儲存修改</button>
    <button class="btn btn-sm warn" id="dmRevertBtn" style="display:none" onclick="revertDrugMgr()">回復</button>
    <button class="btn btn-sm" onclick="cancelDrugMgr()">關閉</button>
  </div>
</div>

<div class="panel-inner" id="mainContent">
  <div class="panel-title">⚕ 幽門桿菌治療設定
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="btn btn-sm" id="resetDefaultsBtn" onclick="resetToDefaults()">恢復預設</button>
      <button class="btn btn-sm" onclick="openDrugMgr()">藥品管理</button>
      <button class="btn btn-sm" id="mgrToggleBtn" onclick="toggleMgr()">組套管理 ▾</button>
    </span>
  </div>
  <div class="panel-sub-row">
    <button class="btn btn-sm" onclick="openSeOverlay()">【藥品副作用及注意事項】</button>
  </div>

  <section id="cloudPanel" hidden>
    <p><span id="cloudAccount">訪客</span> · <span id="cloudStatus" role="status">準備連接…</span></p>
    <div class="cloud-actions">
      <button class="btn btn-sm" id="cloudLogin" onclick="HpCloud.login()">登入</button>
      <button class="btn btn-sm" id="cloudLogout" hidden onclick="HpCloud.logout()">登出</button>
      <button class="btn btn-sm" onclick="HpCloud.refresh()">重新取得雲端設定</button>
      <button class="btn btn-sm" id="cloudSaveNew" hidden onclick="HpCloud.save('user',true)">另存為我的組套</button>
      <button class="btn btn-sm" id="cloudSavePersonal" hidden onclick="HpCloud.save('user')">更新我的組套</button>
      <button class="btn btn-sm" id="cloudDeletePersonal" hidden onclick="HpCloud.remove()">刪除我的組套</button>
      <button class="btn btn-sm" id="cloudSaveSystem" hidden onclick="HpCloud.save('system')">更新系統組套</button>
      <button class="btn btn-sm" id="cloudNewSystem" hidden onclick="HpCloud.save('system',true)">新增系統組套</button>
    </div>
    <p>本次處方僅在此頁面編輯。按下雲端儲存才會更新組套。</p>
  </section>
  <div class="sec-label">療程名稱</div>
  <input id="regimenName" type="text" class="text-input" placeholder="例：鉍劑四合一處方" oninput="onRegimenNameInput()">

  <div class="sec-label">選擇組套</div>
  <div class="preset-grid" id="presetGrid"></div>
  <div class="preset-action-row" id="presetActionRow">
    <button class="btn btn-sm primary" id="saveModBtn" style="display:none" onclick="saveCurrentPreset()">儲存修改</button>
    <button class="btn btn-sm warn" id="revertBtn" style="display:none" onclick="revertToLastSaved()">回復</button>
    <button class="btn btn-sm" onclick="saveAsNewPreset()">另存為新組套</button>
  </div>

  <div class="sec-label">藥物清單</div>
  <div class="phase-toggle-row">
    <label class="toggle-switch"><input type="checkbox" id="phasedToggle" onchange="togglePhased()"><span class="toggle-track"></span></label>
    <span class="toggle-label">兩階段療程</span>
    <select class="phase-dur-select" id="phaseDurSelect" style="display:none" onchange="setPhaseDur(this.value)">
      <option value="7-7">7 + 7 天</option>
      <option value="5-5">5 + 5 天</option>
    </select>
  </div>
  <div id="phaseSections"></div>

  <div class="sec-label">基本設定</div>
  <div class="settings-grid">
    <div class="sf"><label>療程天數</label><input id="duration" type="number" value="14" min="1" max="60" oninput="onDurationInput()"></div>
    <div class="sf"><label>診所 / 醫院</label><input id="clinicName" type="text" placeholder="診所名稱" oninput="renderPreview()"></div>
  </div>
  <div class="sf" style="margin-top:8px"><label>提醒事項</label>
    <textarea id="notes" placeholder="例：&#10;1. 大便顏色可能暫時變黑灰色 (鉍劑)。" oninput="onNotesInput()"></textarea>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" style="flex:1" onclick="window.print()">列印 / 儲存 PDF</button>
    <button class="btn btn-danger" onclick="clearAll()">清除</button>
  </div>
</div><!-- panel-inner -->
</div><!-- input-panel -->

<!-- ══ PREVIEW PANEL ══ -->
<div class="preview-panel">
  <div class="preview-paper" id="previewPaper">
    <div class="preview-title">幽門桿菌治療 服藥指南</div>
    <div class="empty-hint">請選擇組套或新增藥物</div>
  </div>
  <!-- Side effects overlay (covers preview panel) -->
  <div class="side-effects-overlay" id="seOverlay">
    <div class="se-ol-header">
      <span>藥品副作用及注意事項</span>
      <button class="btn btn-sm" onclick="closeSeOverlay()">✕ 關閉</button>
    </div>
    <div class="se-ol-body" id="seOverlayContent"></div>
  </div>
</div>

</div><!-- .app -->


<dialog id="cloudLoginDialog">
  <form id="cloudLoginForm" onsubmit="event.preventDefault();HpCloud.signIn()">
    <h3>登入</h3>
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>密碼 <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">登入</button>
    <button type="button" onclick="document.getElementById('cloudLoginDialog').close()">取消</button>
  </form>
</dialog>
<script src="js/config.js"></script>
<script src="js/defaults.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/cloud.js"></script>
</body>
</html>
